[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haunted-terminal"
version = "0.1.0"
description = "A local LLM whispers short, eerie, in-character commentary after commands you run in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haunted Terminal Authors" }
]
keywords = ["cli", "terminal", "ollama", "ghost", "shell-integration", "local-ai"]
dependencies = [
    "httpx>=0.24.0",
]

[project.scripts]
ghost = "haunted_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
